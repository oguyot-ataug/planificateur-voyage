<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificateur de voyage</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0" />
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div class="app">
    <header>
      <h1><span class="material-symbols-rounded">flight_takeoff</span> Planificateur de voyage</h1>

      <div id="auth-bar" class="auth-bar">
        <form id="form-login" class="auth-login hidden">
          <input type="email" id="login-email" placeholder="Email" required>
          <input type="password" id="login-password" placeholder="Mot de passe">
          <button type="submit">Se connecter</button>
          <button type="button" id="btn-login-magic">Recevoir un lien par email</button>
        </form>
        <p id="login-sent-hint" class="auth-hint hidden">Lien envoyé — vérifie ta boîte mail.</p>
        <div id="auth-connecte" class="auth-connecte hidden">
          <span id="auth-email"></span>
          <button type="button" id="btn-toggle-password">Mot de passe</button>
          <button type="button" id="btn-logout">Déconnexion</button>
        </div>
        <form id="form-set-password" class="auth-set-password hidden">
          <input type="password" id="set-password-value" placeholder="Nouveau mot de passe" required minlength="6">
          <button type="submit">Enregistrer</button>
        </form>
        <p id="set-password-hint" class="auth-hint hidden">Mot de passe enregistré.</p>
      </div>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="saisie">Saisie</button>
        <button class="tab-btn" data-tab="voyage">Mon voyage</button>
        <button class="tab-btn" data-tab="voyageurs">Voyageurs</button>
        <button class="tab-btn" data-tab="budget">Budget</button>
        <button class="tab-btn hidden" data-tab="admin" id="tab-btn-admin">Admin</button>
      </nav>
    </header>

    <p id="non-connecte-message" class="hint-connexion">Connecte-toi ci-dessus pour voir et modifier le voyage.</p>

    <div id="contenu-protege" class="hidden">
    <!-- ONGLET SAISIE -->
    <section id="tab-saisie" class="tab-content active">
      <form id="form-etape">
        <input type="hidden" id="etape-id">
        <input type="hidden" id="etape-type" required>
        <input type="hidden" id="etape-sousType">

        <label>Type</label>
        <div class="chips" id="chips-type">
          <button type="button" class="chip" data-type="Transport"><span class="material-symbols-rounded">directions_car</span><span>Transport</span></button>
          <button type="button" class="chip" data-type="Location"><span class="material-symbols-rounded">car_rental</span><span>Location</span></button>
          <button type="button" class="chip" data-type="Hébergement"><span class="material-symbols-rounded">hotel</span><span>Hébergement</span></button>
          <button type="button" class="chip" data-type="Activité"><span class="material-symbols-rounded">confirmation_number</span><span>Activité</span></button>
          <button type="button" class="chip" data-type="Repas"><span class="material-symbols-rounded">restaurant</span><span>Repas</span></button>
          <button type="button" class="chip" data-type="Autre"><span class="material-symbols-rounded">push_pin</span><span>Autre</span></button>
        </div>

        <div id="chips-soustype-wrap" class="hidden">
          <label>Mode de transport</label>
          <div class="chips" id="chips-soustype">
            <button type="button" class="chip" data-soustype="Avion"><span class="material-symbols-rounded">flight</span><span>Avion</span></button>
            <button type="button" class="chip" data-soustype="Train"><span class="material-symbols-rounded">train</span><span>Train</span></button>
            <button type="button" class="chip" data-soustype="Voiture"><span class="material-symbols-rounded">directions_car</span><span>Voiture</span></button>
            <button type="button" class="chip" data-soustype="Bus"><span class="material-symbols-rounded">directions_bus</span><span>Bus</span></button>
            <button type="button" class="chip" data-soustype="Bateau"><span class="material-symbols-rounded">directions_boat</span><span>Bateau</span></button>
            <button type="button" class="chip" data-soustype="Autre"><span class="material-symbols-rounded">more_horiz</span><span>Autre</span></button>
          </div>
        </div>

        <label>Titre
          <input type="text" id="etape-titre" placeholder="Ex : Chambre 1 — Hôtel Ibis" required>
        </label>

        <label>Lieu
          <input type="text" id="etape-lieu" placeholder="Ex : Aéroport CDG">
        </label>

        <div id="champ-lieu-arrivee-wrap" class="hidden">
          <label>Lieu d'arrivée
            <input type="text" id="etape-lieuArrivee" placeholder="Ex : Aéroport Fiumicino, Rome">
          </label>
        </div>

        <div class="row">
          <label>Date début
            <input type="date" id="etape-dateDebut" required>
          </label>
          <label>Heure début
            <input type="time" id="etape-heureDebut">
          </label>
        </div>

        <div class="row">
          <label>Date fin
            <input type="date" id="etape-dateFin">
          </label>
          <label>Heure fin
            <input type="time" id="etape-heureFin">
          </label>
        </div>

        <label>Détails / notes
          <textarea id="etape-details" rows="3" placeholder="Numéro de vol, référence de réservation..."></textarea>
        </label>

        <label>Lien de réservation
          <input type="url" id="etape-lien" placeholder="https://...">
        </label>

        <div id="bloc-prix-voyageurs">
          <label>Prix (€)
            <input type="number" step="0.01" min="0" id="etape-prix" placeholder="Ex : 189.00">
          </label>

          <label>Payé par</label>
          <input type="hidden" id="etape-payeur">
          <div class="chips" id="chips-payeur"></div>

          <label>Voyageurs concernés</label>
          <div class="chips" id="chips-voyageurs"></div>
          <p id="voyageurs-vide-hint" class="hint hidden">Ajoute des voyageurs dans l'onglet « Voyageurs » pour pouvoir les cocher ici.</p>
        </div>

        <div id="bloc-chambres" class="hidden">
          <label>Chambres</label>
          <div id="chambres-liste"></div>
          <button type="button" id="btn-ajouter-chambre" class="secondary" style="width:100%; margin-bottom:16px;">
            <span class="material-symbols-rounded">add</span> Ajouter une chambre
          </button>
        </div>

        <div class="form-actions">
          <button type="submit" id="btn-save">Ajouter l'étape</button>
          <button type="button" id="btn-cancel" class="secondary hidden">Annuler la modification</button>
        </div>
      </form>

      <h2>Étapes saisies</h2>
      <div id="liste-saisie" class="liste"></div>
    </section>

    <!-- ONGLET MON VOYAGE -->
    <section id="tab-voyage" class="tab-content">
      <div id="liste-voyage" class="voyage"></div>
    </section>

    <!-- ONGLET VOYAGEURS -->
    <section id="tab-voyageurs" class="tab-content">
      <form id="form-voyageur">
        <label>Nom du voyageur
          <input type="text" id="voyageur-nom" placeholder="Ex : Sophie" required>
        </label>
        <div class="form-actions">
          <button type="submit">Ajouter</button>
        </div>
      </form>
      <div id="liste-voyageurs" class="liste"></div>
    </section>

    <!-- ONGLET BUDGET -->
    <section id="tab-budget" class="tab-content">
      <div id="budget-contenu"></div>
    </section>

    <!-- ONGLET ADMIN -->
    <section id="tab-admin" class="tab-content">
      <h2>Comptes autorisés</h2>
      <form id="form-admin-utilisateur">
        <label>Email
          <input type="email" id="admin-email" placeholder="prenom@email.com" required>
        </label>
        <label>Voyageur associé
          <select id="admin-voyageur">
            <option value="">— Aucun —</option>
          </select>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="admin-est-admin"> Compte admin
        </label>
        <div class="form-actions">
          <button type="submit">Ajouter</button>
        </div>
      </form>
      <div id="liste-admin-utilisateurs" class="liste"></div>
    </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
